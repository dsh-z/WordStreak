name: Android CI (WordStreak)

# 标准 Linux CI：官方未修改的 Room 2.8.5，恢复 SQL 编译期查询验证。
# 不使用本地 bionic 兼容开关，也不使用 localrepo。
# 说明：GitHub 托管 ubuntu runner 自带 Android SDK（/usr/local/lib/android/sdk），
# 这里不再使用会失败于 "Failed to find package 'tools'" 的 setup-android@v3，
# 改为显式 sdkmanager 安装平台/build-tools 并接受许可。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build (assembleDebug + assembleDebugAndroidTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK (preinstalled) + install platform/build-tools
        run: |
          set +e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null 2>&1
          echo "----- available platforms/build-tools (tail) -----"
          "$SM" --list 2>/dev/null | grep -iE "platforms;android-[0-9]+|build-tools;[0-9.]+" | tail -50
          echo "----- install -----"
          "$SM" "platform-tools" "platforms;android-37" "build-tools;36.0.0" 2>&1 | tail -20
          true

      - name: Assemble (standard Room 2.8.5 + query verification)
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WordStreak-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  instrumented:
    name: connectedAndroidTest (emulator)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [ 34 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          set +e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          yes | "$SM" --licenses >/dev/null 2>&1
          "$SM" "platform-tools" "platforms;android-37" "build-tools;36.0.0" 2>&1 | tail -10
          true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented DB tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
